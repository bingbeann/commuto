name: Go

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go environment
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    services:
      seaweedfs-s3:
        image: chrislusf/seaweedfs
        restart: unless-stopped
        ports:
          - "8333:8333"
        volumes:
          - ".data/seaweedfs:/data"
        entrypoint: /bin/sh -c
        command: |
          "echo '{
            \"identities\": [
              {
                \"name\": \"anonymous\",
                \"actions\": [
                  \"Read\"
                ]
              },
              {
                \"name\": \"some_admin_user\",
                \"credentials\": [
                  {
                    \"accessKey\": \"key\",
                    \"secretKey\": \"secret\"
                  }
                ],
                \"actions\": [
                  \"Admin\",
                  \"Read\",
                  \"List\",
                  \"Tagging\",
                  \"Write\"
                ]
              }
            ]
          }' > /etc/seaweedfs/config.json && \
          weed server -dir=/data -s3 -s3.config /etc/seaweedfs/config.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go environment
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -tags=integration,e2e ./...
